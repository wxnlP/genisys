# ---------------------------------------------------------------------------
# Zenoh 订阅话题
# ---------------------------------------------------------------------------
topics:
  joint_state: "/geniarm/joint_state"
  joint_cmd: "/geniarm/joint_cmd"
  pose_current: "/geniarm/pose_current"
  pose_expected: "/geniarm/pose_expected"


# ---------------------------------------------------------------------------
# Zenoh 远程连接端点（可选）
# ---------------------------------------------------------------------------
# 当 monitor 和 robot 运行在不同机器上时，填写 robot 的 IP 和端口。
#   - 同一台机器或本地子网组播能通 → 留空即可（默认靠组播自动发现）
#   - 不同机器 / WiFi AP 隔离阻断组播 → 填写 robot 的 tcp 端点
#
# 示例（robot IP 为 192.168.1.100）:
#   zenoh_connect_endpoints:
#     - "tcp/192.168.1.100:7447"
#
# robot 端默认监听 tcp/0.0.0.0:7447，端口在
# src/install/linux/bin/cfg/zenoh_native_config.json5 的 listen.endpoints 中配置。
zenoh_connect_endpoints: []


# ---------------------------------------------------------------------------
# 绘图刷新间隔（毫秒）
# ---------------------------------------------------------------------------
refresh_interval_ms: 2


# ---------------------------------------------------------------------------
# 初始 X 轴视图宽度（秒）
# ---------------------------------------------------------------------------
initial_x_window_s: 10.0


# ---------------------------------------------------------------------------
# Y 轴最小范围
# ---------------------------------------------------------------------------
y_range_min: 0.001

# ---------------------------------------------------------------------------
# UI 缩放因子
# ---------------------------------------------------------------------------
#   >1.0 → 放大（例如 1.25）
#   <1.0 → 缩小（例如 0.85）
#   1.0  = 跟随系统 DPI 缩放
ui_scale: 1.0
