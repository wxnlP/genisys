# ---------------------------------------------------------------------------
# 订阅话题
# ---------------------------------------------------------------------------
# 键名决定 protobuf 消息类型，必须使用以下四个之一：
#   joint_state / joint_cmd / pose_current / pose_expected
topics:
  joint_state: "/geniarm/joint_state"
  joint_cmd: "/geniarm/joint_cmd"
  pose_current: "/geniarm/pose_current"
  pose_expected: "/geniarm/pose_expected"


# ---------------------------------------------------------------------------
# AIMRT 传输层
# ---------------------------------------------------------------------------
# 通过 AIMRT（zenoh 后端）订阅上述话题，与机器人使用同一套 AIMRT / zenoh 版本。
# 以下选项会自动生成临时的 AIMRT 与 zenoh 配置，无需手工维护。
aimrt:
  # 组播自动发现。同网段保持 true 即可。
  # 跨网段或组播被阻断时改为 false，并填写 connect_endpoints。
  multicast_scouting: true

  # 要连接的对端端点。对端必须监听固定端口，例如 robot 端先配置：
  #   listen: { endpoints: { peer: ["tcp/0.0.0.0:7447"] } }
  # 再在此填写 ["tcp/192.168.1.100:7447"]。
  # zenoh 默认 peer 模式监听随机端口，直接填 7447 通常连不通。
  connect_endpoints: []

  # 本机监听的固定端口，需要被对端连入时填写，例如 ["tcp/0.0.0.0:7448"]。
  listen_endpoints: []

  # 指定自己的 zenoh 配置文件（json5）。设置后以上三项被忽略。
  native_cfg_path: ""

  # 运行时日志级别：trace / debug / info / warn / error / fatal / off
  log_level: warn


# ---------------------------------------------------------------------------
# 绘图刷新间隔（毫秒）
# ---------------------------------------------------------------------------
refresh_interval_ms: 2


# ---------------------------------------------------------------------------
# 初始 X 轴视图宽度（秒）
# ---------------------------------------------------------------------------
initial_x_window_s: 10.0


# ---------------------------------------------------------------------------
# Y 轴最小范围
# ---------------------------------------------------------------------------
y_range_min: 0.001

# ---------------------------------------------------------------------------
# UI 缩放因子
# ---------------------------------------------------------------------------
#   >1.0 → 放大（例如 1.25）
#   <1.0 → 缩小（例如 0.85）
#   1.0  = 跟随系统 DPI 缩放
ui_scale: 1.0
