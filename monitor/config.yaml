# =============================================================================
# ArmMonitor 用户配置
# =============================================================================
# 修改后重启应用生效。
# 布尔值用 true/false，字符串用引号，数字直接写。


# ---------------------------------------------------------------------------
# Zenoh 订阅话题
# ---------------------------------------------------------------------------
# 每个话题一个条目，key 为数据源名称（用作 key 前缀），value 为话题表达式。
# 可配置多个话题同时监听。
topics:
  joint_state: "/geniarm/joint_state"
  joint_cmd: "/geniarm/joint_cmd"


# ---------------------------------------------------------------------------
# Zenoh 远程连接端点（可选）
# ---------------------------------------------------------------------------
# 当 monitor 和 robot 运行在不同机器上时，填写 robot 的 IP 和端口。
#   - 同一台机器或本地子网组播能通 → 留空即可（默认靠组播自动发现）
#   - 不同机器 / WiFi AP 隔离阻断组播 → 填写 robot 的 tcp 端点
#
# 示例（robot IP 为 192.168.1.100）:
#   zenoh_connect_endpoints:
#     - "tcp/192.168.1.100:7447"
#
# robot 端默认监听 tcp/0.0.0.0:7447，端口在
# src/install/linux/bin/cfg/zenoh_native_config.json5 的 listen.endpoints 中配置。
zenoh_connect_endpoints: []


# ---------------------------------------------------------------------------
# 绘图刷新间隔（毫秒）
# ---------------------------------------------------------------------------
# 控制界面曲线的更新频率。
#   33ms  ≈ 30 fps（推荐，兼顾流畅度和 CPU 占用）
#   20ms  = 50 fps（更流畅，CPU 略高）
#   50ms  = 20 fps（省电模式）
#  100ms  = 10 fps（低配机器）
refresh_interval_ms: 10


# ---------------------------------------------------------------------------
# 初始 X 轴视图宽度（秒）
# ---------------------------------------------------------------------------
# 仅控制启动时画面中可见的时间跨度，不影响数据保留时长。
# 数据为不限量累积（需手动「↺ 重置数据」清空），可缩放查看任意历史。
initial_x_window_s: 10.0


# ---------------------------------------------------------------------------
# Y 轴最小范围
# ---------------------------------------------------------------------------
# 自动缩放 Y 轴时，保证可见范围不小于该值。
# 当期望/真实数据相差极小（如 0.000001）时，防止 Y 轴缩得过紧导致
# 数值波动不可见、或两条几乎重合的曲线无法分辨。
#   0 = 不设下限（完全自适应，可能缩到微观尺度）
y_range_min: 0.001


# ---------------------------------------------------------------------------
# CSV 导出时间窗口（秒）
# ---------------------------------------------------------------------------
# 导出 CSV 时仅保留最近 N 秒内的数据。
#   0 = 不限量，导出全部累积数据。
csv_export_window_s: 0


# ---------------------------------------------------------------------------
# UI 缩放因子
# ---------------------------------------------------------------------------
# 当自动 DPI 缩放不合适时，手动调整此值微调界面元素大小。
#   >1.0 → 放大（例如 1.25）
#   <1.0 → 缩小（例如 0.85）
#   1.0  = 跟随系统 DPI 缩放（推荐，默认）
ui_scale: 1.0
