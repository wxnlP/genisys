aimrt:
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
      - type: rotate_file # 文件
        options:
          path: ./log
          filename: geniarm_real.log
          max_file_size_m: 4
          max_file_num: 10
  module:
    pkgs:
      - path: ./libarm_control_pkg.so
        disable_modules: []
    modules:
      - name: ActuatorModule
        log_lvl: INFO
      - name: ControlModule
        log_lvl: INFO
  executor:
    executors:
      - name: actuator_pub_executor
        type: asio_thread
      - name: write_cmd_thread
        type: asio_thread
      - name: control_executor
        type: asio_thread
        options:
          thread_bind_cpu: [0]  # 绑定 RK3588 A55 小核
          thread_sched_policy: SCHED_FIFO:80
      - name: pose_pub_executor
        type: asio_thread
      - name: task_pub_executor
        type: asio_thread
      - name: storage_executor
        type: asio_thread
        options:
          thread_num: 2
      - name: record_thread
        type: simple_thread
  plugin:
    plugins:
      # - name: ros2_plugin
      #   path: ./libaimrt_ros2_plugin.so
      #   options:
      #     node_name: pid_sim_demo
      #     executor_type: MultiThreaded
      #     executor_thread_num: 4
      # - name: echo_plugin
      #   path: ./libaimrt_echo_plugin.so
      #   options:
      #     type_support_pkgs:
      #       - path: ./libhardware_type_supprot_pkg.so        
      #     topic_meta_list:
      #       - topic_name: /inverted_pendulum/joint_state
      #         msg_type: ros2:aimrt_msgs/msg/JointStateArray
      #         echo_type: json
      - name: net_plugin
        path: ./libaimrt_net_plugin.so
        options:
          thread_num: 2
          http_options:
            listen_ip: 127.0.0.1
            listen_port: 50080
      - name: zenoh_plugin
        path: ./libaimrt_zenoh_plugin.so
        options:
          native_cfg_path: ./cfg/zenoh_native_config.json5
      - name: record_playback_plugin
        path: ./libaimrt_record_playback_plugin.so
        options:
          timer_executor: storage_executor
          type_support_pkgs:
            - path: ./libsensor_pb_ts.so
          record_actions:
            - name: record_joint_state
              options:
                bag_path: ./bag
                mode: signal
                max_preparation_duration_s: 10
                executor: record_thread
                storage_policy:
                  max_bag_size_m: 2048            # MB
                  msg_write_interval: 1000        # message count period
                  msg_write_interval_time: 1000   # ms
                  compression_mode: zstd          # comression mode
                  compression_level: default      # comression level
                extra_attributes:
                  platform: x86_64
                  os: ubuntu-22.04
                topic_meta_list:
                  - topic_name: /genisys/joint_state
                    msg_type: pb:aimrt.protocols.sensor.JointStateArray
                    serialization_type: pb 
                    record_enabled: true
                    sample_freq: 0
  channel:
    backends:
      - type: local # 官方支持local后端
      - type: zenoh
        options:
          pub_topics_options:
            - topic_name: "(.*)"
              shm_enabled: false
    pub_topics_options:
      # 内部话题：本进程内走 local，同时发布到 zenoh 供外部订阅
      - topic_name: "/genisys/joint_cmd"
        enable_backends: [local, zenoh]
        enable_filters: []
      - topic_name: "/genisys/joint_state"
        enable_backends: [local, zenoh]
        enable_filters: []
      - topic_name: "/genisys/tcp_pose"
        enable_backends: [local, zenoh]
        enable_filters: []
      - topic_name: "/genisys/tcp_pose_expected"
        enable_backends: [local, zenoh]
        enable_filters: []
      - topic_name: "/genisys/flange_pose"
        enable_backends: [local, zenoh]
        enable_filters: []
      - topic_name: "/genisys/task_context"
        enable_backends: [local, zenoh]
        enable_filters: []
    sub_topics_options:
      # 外部 servo 指令入口：从 zenoh 订阅
      - topic_name: "/genisys/servoj_cmd"
        enable_backends: [zenoh]
        enable_filters: []
      - topic_name: "/genisys/servoj_pose_cmd"
        enable_backends: [zenoh]
        enable_filters: []
      - topic_name: "/genisys/servol_cmd"
        enable_backends: [zenoh]
        enable_filters: []
      # 进程内话题：local
      - topic_name: "/genisys/joint_cmd"
        enable_backends: [local]
        enable_filters: []
      - topic_name: "/genisys/joint_state"
        enable_backends: [local]
        enable_filters: []
  rpc:
    backends:
      - type: http
      - type: zenoh
    clients_options:
      - func_name: "(.*)"
        enable_backends: []
        enable_filters: []
    servers_options:
      - func_name: ".*record_playback_plugin.*"
        enable_backends: [http]
        enable_filters: []
      - func_name: "(.*)"
        enable_backends: [http, zenoh]
        enable_filters: []

# Module custom configuration
ActuatorModule:
  config_file: actuator_module/geniarm_actuator_gripper_cfg.yaml
  topic_sub_joint_cmd: /genisys/joint_cmd
  topic_pub_joint_state: /genisys/joint_state
  pub_executor_name: actuator_pub_executor
  pub_frequency: 500 
  write_executor_name: write_cmd_thread
ControlModule:
  config_file: control_module/geniarm_body_gripper_gravity_cfg.yaml
  topic_pub_joint_cmd: /genisys/joint_cmd
  topic_sub_joint_state: /genisys/joint_state
  topic_pub_tcp_pose_expected: /genisys/tcp_pose_expected
  topic_pub_tcp_pose: /genisys/tcp_pose
  topic_pub_flange_pose: /genisys/flange_pose
  topic_sub_servoj_cmd: /genisys/servoj_cmd
  topic_sub_servoj_pose_cmd: /genisys/servoj_pose_cmd
  topic_sub_servol_cmd: /genisys/servol_cmd
  control_executor_name: control_executor
  pose_publish_executor_name: pose_pub_executor
  control_frequency: 500
  pose_publish_frequency: 500
  topic_pub_task_context: /genisys/task_context
  task_publish_executor_name: task_pub_executor
  task_publish_frequency: 50
