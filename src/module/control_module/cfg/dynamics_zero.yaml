dynamics:
  gravity: [0.0, 0.0, -9.81]
  # 所有坐标在对应连杆坐标系 {i} 中表达（与 MDH 一致）
  # mass : 连杆质量 (kg)
  # com  : 质心在连杆坐标系 {i} 中的位置 (m)
  # inertia : 绕质心的惯性张量 (kg·m²)，对称矩阵只需 6 个独立分量
  links:
    - name: "link1"
      mass: 0
      com: [0.0, 0.0, 0.0]
      inertia:
        ixx: 0.0
        iyy: 0.0
        izz: 0.0
        ixy: 0.0
        ixz: 0.0
        iyz: 0.0

    - name: "link2"
      mass: 0
      com: [0.0, 0.0, 0.0]
      inertia:
        ixx: 0.0
        iyy: 0.0
        izz: 0.0
        ixy: 0.0
        ixz: 0.0
        iyz: 0.0

    - name: "link3"
      mass: 0
      com: [0.0, 0.0, 0.0]
      inertia:
        ixx: 0.0
        iyy: 0.0
        izz: 0.0
        ixy: 0.0
        ixz: 0.0
        iyz: 0.0

    - name: "link4"
      mass: 0
      com: [0.0, 0.0, 0.0]
      inertia:
        ixx: 0.0
        iyy: 0.0
        izz: 0.0
        ixy: 0.0
        ixz: 0.0
        iyz: 0.0

    - name: "link5"
      mass: 0
      com: [0.0, 0.0, 0.0]
      inertia:
        ixx: 0.0
        iyy: 0.0
        izz: 0.0
        ixy: 0.0
        ixz: 0.0
        iyz: 0.0

    - name: "link6"
      mass: 0
      com: [0.0, 0.0, 0.0]
      inertia:
        ixx: 0.0
        iyy: 0.0
        izz: 0.0
        ixy: 0.0
        ixz: 0.0
        iyz: 0.0

  # ---- 关节摩擦参数 ----
  # coulomb : 库仑摩擦系数 (N·m)
  # viscous : 粘性摩擦系数 (N·m·s/rad)
  friction:
    joint1: {coulomb: 0.0, viscous: 0.0}
    joint2: {coulomb: 0.0, viscous: 0.0}
    joint3: {coulomb: 0.0, viscous: 0.0}
    joint4: {coulomb: 0.0, viscous: 0.0}
    joint5: {coulomb: 0.0, viscous: 0.0}
    joint6: {coulomb: 0.0, viscous: 0.0}
