dynamics:
  gravity: [0.0, 0.0, -9.81]
  # 来源: ~/RoboModels/urdf/Geniarm-v1.1.5/urdf/Geniarm-v1.1.5.urdf
  #       动力学由 CAD 质量属性报告 (RoboModels/pic/*.png) 替换：
  #       base/shoulder/upper_arm/elbow/wrist3 沿用 v1.1.4（零件未变），
  #       wrist1 / wrist2 取 pic/5.png / pic/6.png 的 v1.1.5 新值
  # 所有坐标在对应连杆坐标系 {i} 中表达（与 MDH 一致）
  # mass : 连杆质量 (kg)
  # com  : 质心在连杆坐标系 {i} 中的位置 (m)
  # inertia : 绕质心的惯性张量 (kg·m²)，对称矩阵只需 6 个独立分量
  # 对应关系: link1=shoulder_link, link2=upper_arm_link, link3=elbow_link,
  #           link4=wrist1_link,  link5=wrist2_link,    link6=wrist3_link
  links:
    - name: "shoulder_link"
      mass: 0.215
      com: [0.00461, 0.000543, -0.029142]
      inertia:
        ixx: 0.00030957
        iyy: 0.00020740
        izz: 0.00028536
        ixy: -0.00000179
        ixz: -0.00004071
        iyz: -0.00000340

    - name: "upper_arm_link"
      mass: 1.111
      com: [0.13, -4.5e-05, 0.0]
      inertia:
        ixx: 0.00058895
        iyy: 0.01612706
        izz: 0.01598478
        ixy: 0.00000000
        ixz: -0.00020503
        iyz: 0.00000000

    - name: "elbow_link"
      mass: 0.682
      com: [0.17121, -0.012609, 0.000759]
      inertia:
        ixx: 0.00062101
        iyy: 0.00615984
        izz: 0.00618878
        ixy: -0.00077041
        ixz: -0.00006785
        iyz: -0.00000610

    - name: "wrist1_link"
      mass: 0.441
      com: [0.062018, -0.059388, -0.000649]
      inertia:
        ixx: 0.000456290
        iyy: 0.000537479
        izz: 0.000684587
        ixy: 0.000255590
        ixz: -0.000005589
        iyz: 0.000004932

    - name: "wrist2_link"
      mass: 0.378
      com: [0.000374, -0.002002, -0.003453]
      inertia:
        ixx: 0.000211771
        iyy: 0.000217010
        izz: 0.000161552
        ixy: 0.000000006
        ixz: -0.000000078
        iyz: 0.000004265

    - name: "wrist3_link"
      mass: 0.0087849
      com: [-0.000629, 0.0, -0.003103]
      inertia:
        ixx: 0.00000078
        iyy: 0.00000064
        izz: 0.00000136
        ixy: 0.00000000
        ixz: 0.00000000
        iyz: 0.00000000

  # ---- 末端工具：Geni-Gripper v1.1.5 夹爪 ----
  # 用途: 由 ArmManager 在加载配置时融合进 attach_to 指定的连杆
  #       （质量相加 + 质心加权 + 平行轴定理），求解器无需改动
  # 坐标系: 参数以「挂载连杆的坐标系」表达（本机 = wrist3_link 的坐标系 {6}），
  #         且按实装朝向测量。若换用其他坐标系下的数据，需先做 R·I·Rᵀ
  # 数据来源: pic/gripper.png —— 整爪 0.666 kg、质心 (-0.383, 12.980, 46.286) mm、
  #           绕质心惯性 1444.272/905.564/1146.424/2.759/0.970/37.386 (kg·mm²)，
  #           非对角项已按 URDF 约定变号
  # 交叉校验: wrist3_link + 本 tool = pic/g-7.png 的 0.674 kg /
  #           (-0.386, 12.811, 45.643) mm / 1467.661… (逐值吻合)
  # 本文件不带夹爪：tool 段整段注释，接夹爪时改用 *_gripper.yaml
  # tool:
  #   attach_to: wrist3_link
  #   mass: 0.666
  #   com: [-0.000383, 0.012980, 0.046286]
  #   inertia:
  #     ixx: 0.001444272
  #     iyy: 0.000905564
  #     izz: 0.001146424
  #     ixy: -0.000002759
  #     ixz: -0.000000970
  #     iyz: -0.000037386

  # ---- 关节摩擦参数 ----
  # coulomb : 库仑摩擦系数 (N·m)，取自 MJCF 中各关节的 frictionloss（与 v1.1.4 相同）
  # viscous : 粘性摩擦系数 (N·m·s/rad)
  friction:
    joint1: {coulomb: 0.8, viscous: 0.0}
    joint2: {coulomb: 1.0, viscous: 0.0}
    joint3: {coulomb: 0.8, viscous: 0.0}
    joint4: {coulomb: 0.3, viscous: 0.0}
    joint5: {coulomb: 0.3, viscous: 0.0}
    joint6: {coulomb: 0.2, viscous: 0.0}
