syntax = "proto3";

import "error.proto";
import "pose.proto";

package robotic_arm.protocols;

message Joint {
  repeated double position = 1;
}

message MoveLRequest {
  Pose pose = 1;
  double v = 2;
  double a = 3;
}

message MoveJRequest {
  Joint position = 1;
  double v = 2;
  double a = 3;
}

message MoveLMultiRequest {
  repeated Pose pose = 1;
  double r = 2;
  double v = 3;
  double a = 4;
}

message MoveJMultiRequest {
  repeated Joint position = 1;
  double r = 2;
  double v = 3;
  double a = 4;
}

message GripperRequest {
  double position = 1;
  double velocity = 2;
  double acceleration = 3;
  double effort = 4;
}

message MoveResponse {
  aimrt.protocols.common.Error error = 1;
}

service MoveControlService {
  rpc MoveL(MoveLRequest) returns (MoveResponse);
  rpc MoveJ(MoveJRequest) returns (MoveResponse);
  rpc MoveLMulti(MoveLMultiRequest) returns (MoveResponse);
  rpc MoveJMulti(MoveJMultiRequest) returns (MoveResponse);
  rpc Gripper(GripperRequest) returns (MoveResponse);
}